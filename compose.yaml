services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: basis_auth
      POSTGRES_USER: basis_auth
      POSTGRES_PASSWORD: basis_auth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basis_auth -d basis_auth"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - basis-auth-postgres:/var/lib/postgresql/data

volumes:
  basis-auth-postgres:
