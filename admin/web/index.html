<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basis Admin Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f7f8;
        --panel: #ffffff;
        --panel-2: #f1f3f4;
        --border: #dfe3e7;
        --border-strong: #c9ced4;
        --text: #171a1f;
        --muted: #5c6570;
        --accent: #0c7365;
        --accent-hover: #0a5f54;
        --accent-soft: #e2efec;
        --accent-text: #08544a;
        --danger: #b3261e;
        --danger-soft: #fbebea;
        --ok: #1a7f37;
        --ok-soft: #e7f4eb;
        --warn: #8f6002;
        --warn-soft: #fbf2da;
        --shadow: 0 1px 2px rgba(23, 26, 31, .07);
        --radius: 10px;
      }
      html.dark {
        --bg: #131518;
        --panel: #1c1f23;
        --panel-2: #24282d;
        --border: #33383e;
        --border-strong: #4a5058;
        --text: #e8eaed;
        --muted: #a3abb5;
        --accent: #45b8a6;
        --accent-hover: #63cab9;
        --accent-soft: #1b332f;
        --accent-text: #7fd6c8;
        --danger: #ef6b62;
        --danger-soft: #38201e;
        --ok: #5cb867;
        --ok-soft: #1d3021;
        --warn: #d3a03c;
        --warn-soft: #33290f;
        --shadow: 0 1px 3px rgba(0, 0, 0, .45);
      }
      * { box-sizing: border-box; }
      body {
        font-family: "Noto Sans", ui-sans-serif, sans-serif;
        margin: 0; background: var(--bg); color: var(--text); font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code, .mono { font-family: "Noto Sans Mono", Consolas, monospace; font-size: .92em; }

      /* ---------- App bar ---------- */
      .appbar {
        height: 54px; display: flex; align-items: center; gap: 12px;
        padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 30;
      }
      .brand { font-weight: 700; font-size: 15px; white-space: nowrap; display: flex; align-items: center; gap: 9px; color: var(--text); }
      .brand svg { color: var(--accent); }
      .search { flex: 1; max-width: 460px; margin: 0 auto; position: relative; }
      .search input {
        width: 100%; padding: 7px 12px 7px 34px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--bg); color: var(--text);
      }
      .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
      .appbar .spacer { flex: 1; }
      @media (max-width: 720px) { .search { display: none; } }

      /* ---------- Layout ---------- */
      .shell { display: flex; min-height: calc(100vh - 54px); }
      .sidebar {
        width: 228px; flex-shrink: 0; background: var(--panel);
        border-right: 1px solid var(--border); padding: 12px 10px;
        transition: width .15s ease; overflow: hidden auto; position: sticky; top: 54px;
        height: calc(100vh - 54px);
      }
      .sidebar.collapsed { width: 54px; }
      .navgroup { margin-top: 16px; }
      .navlabel {
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
        color: var(--muted); padding: 0 12px 5px; white-space: nowrap;
      }
      .collapsed .navlabel { visibility: hidden; height: 6px; padding: 0; }
      .navitem {
        display: flex; align-items: center; gap: 10px; padding: 7px 11px; margin-bottom: 1px;
        border-radius: 7px; color: var(--text); cursor: pointer; white-space: nowrap;
      }
      .navitem:hover { background: var(--panel-2); text-decoration: none; }
      .navitem.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
      .collapsed .navitem span { display: none; }

      main.content { flex: 1; padding: 22px 30px 56px; min-width: 0; }
      .crumbs { color: var(--muted); font-size: 13px; margin-bottom: 14px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      h1.page-title { font-size: 21px; margin: 0 0 4px; font-weight: 700; }
      p.page-sub { color: var(--muted); margin: 0 0 20px; }
      .page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
      .page-head .grow { flex: 1; }

      /* ---------- Cards / tiles ---------- */
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
      .card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 14px; margin-bottom: 20px; }
      .tile { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
      .tile .ticon { width: 38px; height: 38px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex-shrink: 0; }
      .tile.warn .ticon { background: var(--warn-soft); color: var(--warn); }
      .tile.bad .ticon { background: var(--danger-soft); color: var(--danger); }
      .tile .tnum { font-size: 22px; font-weight: 700; line-height: 1.1; }
      .tile .tlabel { color: var(--muted); font-size: 12px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      @media (max-width: 1100px) { .two-col { grid-template-columns: 1fr; } }

      /* ---------- Tables ---------- */
      .tablewrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border-strong);
        white-space: nowrap;
      }
      td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover { background: var(--panel-2); }
      tbody tr.clickable { cursor: pointer; }

      .usercell { display: flex; align-items: center; gap: 10px; }
      .avatar {
        width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
        display: grid; place-items: center; font-size: 12px; font-weight: 600;
        background: var(--accent-soft); color: var(--accent-text);
      }
      .avatar.lg { width: 64px; height: 64px; font-size: 22px; }

      .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
      .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .pill.ok { background: var(--ok-soft); color: var(--ok); }
      .pill.bad { background: var(--danger-soft); color: var(--danger); }
      .pill.warn { background: var(--warn-soft); color: var(--warn); }
      .pill.off { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
      .pill.off::before { display: none; }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chipx {
        display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 9px;
        background: var(--accent-soft); color: var(--accent-text); border-radius: 999px; font-size: 12px;
      }
      .chipx button { border: none; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; padding: 2px; border-radius: 50%; }
      .chipx button:hover { background: rgba(127, 127, 127, .25); }

      /* ---------- Controls ---------- */
      .btn {
        display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px;
        border-radius: 7px; border: 1px solid var(--border-strong); background: var(--panel);
        color: var(--text); font-size: 13.5px; cursor: pointer; font-family: inherit; font-weight: 500;
      }
      .btn:hover { background: var(--panel-2); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
      html.dark .btn.primary { color: #10201d; }
      .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
      .btn.danger:hover { background: var(--danger-soft); }
      .btn.ghost { border-color: transparent; }
      .btn.ghost:hover { background: var(--panel-2); }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .iconbtn {
        border: none; background: none; color: var(--muted); cursor: pointer;
        padding: 6px; border-radius: 7px; display: grid; place-items: center;
      }
      .iconbtn:hover { background: var(--panel-2); color: var(--text); }
      input.input, select.input, textarea.input {
        padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border-strong);
        background: var(--panel); color: var(--text); font-size: 13.5px; font-family: inherit;
      }
      textarea.input { resize: vertical; min-height: 70px; }
      input.input:focus, select.input:focus, textarea.input:focus, .search input:focus {
        outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft);
      }
      .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
      .toolbar .grow { flex: 1; }
      .kv { display: grid; grid-template-columns: 170px 1fr; row-gap: 9px; column-gap: 14px; font-size: 13.5px; }
      .kv dt { color: var(--muted); }
      .kv dd { margin: 0; }
      label.field { display: block; margin-bottom: 12px; }
      label.field span { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
      label.field input, label.field select, label.field textarea { width: 100%; }
      .checkline { display: flex; gap: 8px; align-items: center; font-size: 13.5px; margin-bottom: 10px; }

      /* ---------- Overlays ---------- */
      .backdrop { position: fixed; inset: 0; background: rgba(12, 15, 18, .48); z-index: 90; display: grid; place-items: center; padding: 20px; }
      .modal { background: var(--panel); border-radius: 12px; box-shadow: 0 14px 44px rgba(0, 0, 0, .32); width: 100%; max-width: 480px; padding: 22px; max-height: 88vh; overflow-y: auto; }
      .modal h3 { margin: 0 0 12px; font-size: 16px; }
      .secret-box {
        font-family: "Noto Sans Mono", Consolas, monospace; background: var(--bg); border: 1px dashed var(--border-strong);
        padding: 10px 12px; border-radius: 8px; word-break: break-all; margin: 10px 0;
      }
      .toast-stack { position: fixed; right: 18px; bottom: 18px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
      .toast {
        background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--ok);
        box-shadow: var(--shadow); border-radius: 8px; padding: 10px 14px; max-width: 380px;
        animation: slidein .18s ease;
      }
      .toast.err { border-left-color: var(--danger); }
      @keyframes slidein { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

      .skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--border) 25%, var(--panel-2) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.1s infinite linear; margin: 12px 10px; }
      @keyframes shimmer { to { background-position: -200% 0; } }
      .empty { text-align: center; color: var(--muted); padding: 34px 10px; }
      .empty svg { opacity: .55; margin-bottom: 8px; }
      .banner { border-radius: var(--radius); padding: 12px 16px; margin-bottom: 18px; display: flex; gap: 10px; align-items: center; border: 1px solid; }
      .banner.locked { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
      .banner.info { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }
      pre.cmd { background: var(--bg); border: 1px solid var(--border); padding: 9px 12px; border-radius: 8px; overflow-x: auto; }

      .accountbtn { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--border); padding: 4px 10px 4px 4px; border-radius: 999px; cursor: pointer; color: var(--text); font-family: inherit; font-size: 13px; }
      .accountbtn:hover { background: var(--panel-2); }
      .menu {
        position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel);
        border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
        min-width: 250px; padding: 8px; z-index: 60;
      }
      .menu .who { padding: 8px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
      .menu .who .em { font-weight: 600; }
      .menu .perms { padding: 4px 10px; color: var(--muted); font-size: 12px; line-height: 1.7; }
      .menu hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
      .relative { position: relative; }
    </style>
    <script>
      try {
        const saved = localStorage.getItem("basis-admin-theme");
        if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
